# Minimal Supabase CLI config. The project is linked with:
#   npx supabase link --project-ref <your-project-ref>
project_id = "autobim-hub"

[functions.create-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# The Revit tools authenticate by licence key, not a Supabase session.
[functions.verify]
verify_jwt = false
